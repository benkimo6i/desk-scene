<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desk scene</title>
    <style>
      :root { --ink: #0B4C92; }
      html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
      canvas { position: relative; display: block; width: 100vw; height: 100vh; opacity: 0; transition: opacity 300ms linear; touch-action: none; }
      canvas.shown { opacity: 1; }
      /* A still of the empty room shows until the 3D room has drawn. It lines up only where the camera
         never turns (16:10 and wider) and up to the still's own width (2.4:1). */
      #poster { position: fixed; inset: 0; background: center / auto 100% no-repeat; }
      @media (min-aspect-ratio: 8/5) and (max-aspect-ratio: 12/5) { #poster { background-image: var(--poster); } }
      /* The city and time-of-day controls for keyboard and screen-reader users. Mouse users pick
         on the monitor and laptop; the panel stays out of sight until a button has focus. */
      #controls { position: fixed; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
        max-width: calc(100vw - 48px); padding: 8px 10px; border-radius: 8px; background: #fffd; color: #123;
        font: 12px/1.2 system-ui, sans-serif; }
      #controls:not(:focus-within) { width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      #controls [role='group'] { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      #controls span { font-weight: 600; }
      #controls button { padding: 4px 8px; border: 1px solid #1236; border-radius: 5px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
      #controls button[aria-pressed='true'] { background: #123; color: #fff; }
      #controls button:focus-visible { outline: 2px solid #123; outline-offset: 2px; }
      /* Shown instead of the scene without a mouse or trackpad (the pen, notebook and hover need
         one), or while the window is under 1024 x 640 (the menus and clock get too small). A
         desktop window that grows back past that uncovers the scene, which kept running. */
      #fallback { display: none; position: fixed; inset: 0; z-index: 1; place-content: center; padding: 24px;
        background: var(--fallback-back, #083A72); color: var(--fallback-text, #EFE6D2); text-align: center;
        font-family: 'Inter Tight Variable', Helvetica, Arial, sans-serif; }
      #fallback h1 { margin: 0 0 8px; font-size: clamp(24px, 6vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
      #fallback p { margin: 0; font-size: clamp(15px, 4vw, 18px); line-height: 1.4; opacity: 0.85; }
      @media not all and (any-pointer: fine), (max-width: 1023.98px), (max-height: 639.98px) {
        #fallback { display: grid; }
        canvas, #controls { visibility: hidden; }
        #poster { display: none; } /* and its still isn't fetched */
      }
    </style>
  </head>
  <body>
    <div id="poster" aria-hidden="true"></div>
    <main id="fallback">
      <h1>Best explored on a computer.</h1>
      <p>This interactive desk needs a mouse and a larger window.</p>
    </main>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
