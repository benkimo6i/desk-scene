<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desk scene</title>
    <style>
      :root { --ink: #0B4C92; }
      html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
      canvas { position: relative; display: block; width: 100vw; height: 100vh; opacity: 0; transition: opacity 300ms linear; touch-action: none; }
      canvas.shown { opacity: 1; }
      /* A still of the empty room shows until the 3D room has drawn. It lines up only where the camera
         never turns (16:10 and wider) and up to the still's own width (2.4:1). */
      #poster { position: fixed; inset: 0; background: center / auto 100% no-repeat; }
      @media (min-aspect-ratio: 8/5) and (max-aspect-ratio: 12/5) { #poster { background-image: var(--poster); } }
      #review { position: fixed; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
        max-width: calc(100vw - 48px); padding: 8px 10px; border-radius: 8px; background: #fffd; color: #123;
        font: 12px/1.2 system-ui, sans-serif; }
      #review span { font-weight: 600; margin-left: 6px; }
      #review button { padding: 4px 8px; border: 1px solid #1236; border-radius: 5px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
      #review button[aria-pressed='true'] { background: #123; color: #fff; }
    </style>
  </head>
  <body>
    <div id="poster" aria-hidden="true"></div>
    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
